<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Колесо фортуны — Fakrap</title>
<meta name="theme-color" content="#07120e">
<meta name="description" content="Колесо фортуны Fakrap: восемнадцать секторов, множители до ×6. Демо-фишки, без реальных денег.">
<link rel="icon" type="image/png" href="../../shared/brand/fakrap-icon.png">
<link rel="apple-touch-icon" href="../../shared/brand/fakrap-icon.png">
<link rel="stylesheet" href="../../shared/casino.css">
<link rel="stylesheet" href="wheel.css">
  <link rel="stylesheet" href="../../shared/hud.css">
</head>
<body class="casino-page wheel-page">

<header class="topbar">
  <div class="brand">
    <a class="brand-mark" href="../../index.html" title="Все игры" aria-label="Fakrap — все игры">
      <img class="brand-logo" src="../../shared/brand/fakrap.png" alt="Fakrap">
      <span class="brand-coin" aria-hidden="true">F</span>
    </a>
    <div class="brand-text">
      <span>WHEEL</span>
    </div>
  </div>

  <div class="bankroll-box">
    <span class="bankroll-label">Баланс</span>
    <span class="bankroll" id="bankroll">1 000&nbsp;₽</span>
    <div class="delta-layer" id="deltaLayer"></div>
  </div>

  <div class="tools">
    <a class="icon-btn" href="../../index.html" title="Все игры" aria-label="Все игры">
      <img class="icon-img" src="../../shared/brand/icons/home.png" alt="">
    </a>
    <button class="icon-btn" id="soundBtn" title="Звук" aria-label="Включить или выключить звук" data-sound-on="../../shared/brand/icons/sound-on.png" data-sound-off="../../shared/brand/icons/sound-off.png">
      <img class="icon-img" src="../../shared/brand/icons/sound-on.png" alt="">
    </button>
    <button class="icon-btn" id="rulesBtn" title="Правила" aria-label="Правила колеса">
      <img class="icon-img" src="../../shared/brand/icons/rules.png" alt="">
    </button>
    <button class="icon-btn" id="historyTopBtn" title="История вращений" aria-label="История вращений">
      <img class="icon-img" src="../../shared/brand/icons/history.png" alt="">
    </button>
    <button class="icon-btn" id="statsBtn" title="Статистика" aria-label="Статистика колеса">
      <img class="icon-img" src="../../shared/brand/icons/stats.png" alt="">
    </button>
  </div>
</header>

<main class="wheel-main">

  <section class="wheel-area" aria-label="Колесо">
    <div class="wheel-stage">
      <div class="wheel-pointer" aria-hidden="true"></div>
      <div class="wheel-rim">
        <div class="wheel-disc" id="wheelDisc">
          <div class="wheel-labels" id="wheelLabels"></div>
        </div>
        <div class="wheel-hub" aria-hidden="true">F</div>
      </div>
    </div>

    <div class="wheel-result" id="wheelResult" aria-live="polite">
      <span class="wheel-result-label" id="resultLabel">Готовы?</span>
      <strong class="wheel-result-value" id="resultValue">—</strong>
    </div>

    <div class="wheel-controls">
      <button class="primary-btn wheel-spin" id="spinBtn" type="button">Крутить</button>
      <button class="ghost-btn" id="maxBetBtn" type="button">Максимум</button>
    </div>

    <div class="message" id="message" aria-live="polite">Выберите ставку и крутите колесо</div>
  </section>

  <section class="wheel-panel" aria-label="Ставка и секторы">
    <div class="bet-total">
      <span>Ставка за вращение</span>
      <strong id="betTotal">25&nbsp;₽</strong>
      <span class="bet-limit" id="betLimit">из 2 500&nbsp;₽</span>
    </div>

    <div class="chips-row" id="chipsRow">
      <button class="chip c25" data-chip="25" aria-label="Ставка 25"><span>25</span></button>
      <button class="chip c100" data-chip="100" aria-label="Ставка 100"><span>100</span></button>
      <button class="chip c250" data-chip="250" aria-label="Ставка 250"><span>250</span></button>
      <button class="chip c500" data-chip="500" aria-label="Ставка 500"><span>500</span></button>
      <button class="chip c1000" data-chip="1000" aria-label="Ставка 1 000"><span>1 000</span></button>
      <button class="chip c2500" data-chip="2500" aria-label="Ставка 2 500"><span>2 500</span></button>
    </div>

    <p class="bet-hint" id="betHint" hidden></p>

    <h2 class="panel-title">Секторы колеса</h2>
    <div class="sector-list" id="sectorList"></div>
        <p class="hint"><kbd>Space</kbd> — крутить, <kbd>H</kbd> — история,
      <kbd>R</kbd> — правила. Клавиши работают на любой раскладке.</p>
  </section>

  <section class="wheel-history" aria-labelledby="wheelHistoryTitle">
    <div class="rolls-head">
      <h2 id="wheelHistoryTitle">История вращений</h2>
      <button class="ghost-btn" id="historyBtn" type="button">Вся история</button>
    </div>
    <div class="rolls-list" id="spinsList"></div>
  </section>

</main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="../../shared/casino.js"></script>
<script src="wheel.js"></script>
</body>
</html>
