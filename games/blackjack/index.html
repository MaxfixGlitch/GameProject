<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Блэкджек 21 — Fakrap</title>
<meta name="theme-color" content="#07120e">
<meta name="description" content="Классический блэкджек (21) с фишками, сплитом, удвоением и статистикой.">
<link rel="icon" type="image/png" href="../../shared/brand/fakrap-icon.png">
<link rel="apple-touch-icon" href="../../shared/brand/fakrap-icon.png">
<link rel="stylesheet" href="../../shared/cards.css">
<link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../shared/hud.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <a class="brand-mark" href="../../index.html" title="Все игры" aria-label="Fakrap — все игры">
        <img class="brand-logo" src="../../shared/brand/fakrap.png" alt="Fakrap">
        <span class="brand-coin" aria-hidden="true">F</span>
      </a>
      <div class="brand-text">
        <span>BLACKJACK</span>
      </div>
    </div>

    <div class="bankroll-box">
      <span class="bankroll-label">Баланс</span>
      <span class="bankroll" id="bankroll">1 000&nbsp;₽</span>
      <div class="delta-layer" id="deltaLayer"></div>
    </div>

    <div class="tools">
      <a class="icon-btn" href="../../index.html" title="Все игры" aria-label="Все игры">
        <img class="icon-img" src="../../shared/brand/icons/home.png" alt="">
      </a>
      <button class="icon-btn" id="soundBtn" title="Звук" aria-label="Включить или выключить звук" data-sound-on="../../shared/brand/icons/sound-on.png" data-sound-off="../../shared/brand/icons/sound-off.png">
        <img class="icon-img" src="../../shared/brand/icons/sound-on.png" alt="">
      </button>
      <button class="icon-btn" id="rulesBtn" title="Правила" aria-label="Правила игры">
        <img class="icon-img" src="../../shared/brand/icons/rules.png" alt="">
      </button>
      <button class="icon-btn" id="historyBtn" title="История раздач" aria-label="История раздач">
        <img class="icon-img" src="../../shared/brand/icons/history.png" alt="">
      </button>
      <button class="icon-btn" id="statsBtn" title="Статистика" aria-label="Статистика">
        <img class="icon-img" src="../../shared/brand/icons/stats.png" alt="">
      </button>
      <button class="icon-btn" id="resetBtn" title="Начать заново" aria-label="Начать заново">
        <img class="icon-img" src="../../shared/brand/icons/reset.png" alt="">
      </button>
    </div>
  </header>

  <main class="board">
    <div class="table">
      <div class="felt" id="felt">

        <div class="shoe-badge" title="Осталось карт в шузе">
          <img class="shoe-icon" src="../../shared/brand/icons/shoe.png" alt="">
          <span id="shoeCount">312</span>
        </div>

        <section class="zone dealer-zone">
          <div class="zone-head">
            <span class="zone-name">Дилер</span>
            <span class="total-badge" id="dealerTotal"></span>
          </div>
          <div class="hand" id="dealerHand"></div>
        </section>

        <div class="center">
          <div class="message" id="message">Поставьте фишки и нажмите «Раздать»</div>
          <div class="bet-spot empty" id="betSpot">
            <span class="bet-label">Ставка</span>
            <div class="bet-chips" id="betChips" aria-hidden="true"></div>
            <div class="bet-amount" id="betAmount">0&nbsp;₽</div>
          </div>
        </div>

        <section class="zone player-zone">
          <div class="hands" id="hands"></div>
        </section>

      </div>
    </div>
  </main>

  <footer class="console">
    <div class="panel bet-panel" id="betPanel">
      <div class="chips-row" id="chipsRow">
        <button class="chip c25" data-chip="25" aria-label="Фишка 25"><span>25</span></button>
        <button class="chip c50" data-chip="50" aria-label="Фишка 50"><span>50</span></button>
        <button class="chip c100" data-chip="100" aria-label="Фишка 100"><span>100</span></button>
        <button class="chip c250" data-chip="250" aria-label="Фишка 250"><span>250</span></button>
        <button class="chip c500" data-chip="500" aria-label="Фишка 500"><span>500</span></button>
      </div>
      <div class="bet-actions">
        <button class="ghost-btn" id="clearBet">Сброс ставки</button>
        <button class="primary-btn" id="dealBtn">Раздать</button>
      </div>
    </div>

    <div class="panel action-panel" id="actionPanel" hidden>
      <button class="action-btn hit" id="hitBtn"><span>Ещё</span><kbd>H</kbd></button>
      <button class="action-btn stand" id="standBtn"><span>Хватит</span><kbd>S</kbd></button>
      <button class="action-btn double" id="doubleBtn"><span>Удвоить</span><kbd>D</kbd></button>
      <button class="action-btn split" id="splitBtn"><span>Сплит</span><kbd>P</kbd></button>
    </div>

    <div class="panel rebuy-panel" id="rebuyPanel" hidden>
      <p>Фишки закончились. Возьмите демо-пополнение и продолжайте.</p>
      <button class="primary-btn" id="rebuyBtn">Пополнить +1 000&nbsp;₽</button>
    </div>
  </footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="../../shared/casino.js"></script>
<script src="game.js"></script>
</body>
</html>
