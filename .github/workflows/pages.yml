name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Собрать статику игры
        run: |
          mkdir -p _site
          cp Projects-Word-arena-92cdabc7-projects-word/index.html \
             Projects-Word-arena-92cdabc7-projects-word/style.css \
             Projects-Word-arena-92cdabc7-projects-word/game.js \
             _site/

      - name: Включить GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Загрузить артефакт
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
