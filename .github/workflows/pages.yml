name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Собрать статику казино
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r shared games _site/
          echo "Опубликовано:"; find _site -type f | sort

      - name: Включить GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Загрузить артефакт
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
